version: "3.8"

services:

  mysql:
    image: mysql:8.0
    container_name: echeq-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: echeq_db

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .

    container_name: echeq-backend

    restart: unless-stopped

    depends_on:
      - mysql

    ports:
      - "${SERVER_PORT}:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/echeq_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

volumes:
  mysql_data: